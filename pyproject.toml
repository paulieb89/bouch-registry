[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bouch-registry"
version = "0.3.0"
description = "Bouch capability metaregistry exposed as an MCP server and a static registry.json"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Paul Boucherat", email = "paul@bouch.dev" },
]
dependencies = [
    "fastmcp==3.4.7",
    "httpx>=0.28",
]

[project.scripts]
bouch-registry = "bouch_registry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bouch_registry"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
