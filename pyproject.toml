[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bouch-registry"
version = "0.7.0"
description = "Bouch capability catalogue: validated pointer records with a local search and verification CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Paul Boucherat", email = "paul@bouch.dev" },
]
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
bouch-registry = "bouch_registry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bouch_registry"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
